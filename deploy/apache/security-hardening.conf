# Apache hardening for Analytify QA deployment
# Deny direct access to the legacy /errors path discovered during scanning
RedirectMatch 404 ^/errors(/|$)

<Directory "/var/www/qa.insightapps.ai/errors">
    Require all denied
</Directory>

# Enforce HTTPS for every request
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</IfModule>

# Hide detailed server information
ServerTokens Prod
ServerSignature Off

# Disable directory indexing everywhere by default
<Directory "/var/www/qa.insightapps.ai">
    Options -Indexes
</Directory>

<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</IfModule>

# Allow access to static assets via caching without exposing server version
<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>
